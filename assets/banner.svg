<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06101e"/><stop offset="50%" stop-color="#0b1e38"/><stop offset="100%" stop-color="#040c17"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><radialGradient id="radar-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".3"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/></radialGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes waveMove{0%{transform:translateX(0)}50%{transform:translateX(-40px)}}@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes floatShip{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(1deg)}}.wave{animation:waveMove 8s ease-in-out infinite}.radar{transform-origin:1020px 160px;animation:radarRotate 10s linear infinite}.ship{transform-origin:180px 160px;animation:floatShip 4s ease-in-out infinite}.glow-text{filter:drop-shadow(0 0 8px rgba(0,242,254,.6))}</style><rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/><g stroke="#fff" stroke-opacity=".04" stroke-width="1"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="300" x2="300" y1="0" y2="320"/><line x1="600" x2="600" y1="0" y2="320"/><line x1="900" x2="900" y1="0" y2="320"/></g><g opacity=".6"><circle cx="1020" cy="160" r="110" fill="none" stroke="#00f2fe" stroke-dasharray="4 4" stroke-width="1.5" opacity=".4"/><circle cx="1020" cy="160" r="75" fill="none" stroke="#00f2fe" stroke-width="1" opacity=".3"/><circle cx="1020" cy="160" r="40" fill="none" stroke="#00f2fe" stroke-width="1" opacity=".2"/><circle cx="1020" cy="160" r="110" fill="url(#radar-glow)"/><g class="radar"><path fill="url(#accent-grad)" d="M 1020 160 L 1130 160 A 110 110 0 0 0 1020 50 Z" opacity=".25"/><line x1="1020" x2="1130" y1="160" y2="160" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/></g><circle cx="1060" cy="120" r="3.5" fill="#00f2fe" class="glow-text"/><circle cx="990" cy="200" r="2.5" fill="#4facfe"/><circle cx="1080" cy="190" r="3" fill="#00f2fe"/></g><g class="wave" opacity=".25"><path fill="#00f2fe" d="M-100 260 Q 50 240, 200 260 T 500 260 T 800 260 T 1100 260 T 1400 260 L 1400 320 L -100 320 Z"/><path fill="#4facfe" d="M-100 275 Q 100 260, 300 275 T 700 275 T 1100 275 T 1500 275 L 1500 320 L -100 320 Z"/></g><g class="ship"><path fill="url(#accent-grad)" d="M 100 175 L 240 175 L 270 145 L 245 190 L 110 190 Z" filter="url(#glow)"/><rect width="65" height="45" x="140" y="125" fill="#fff" opacity=".9" rx="3"/><rect width="35" height="20" x="155" y="105" fill="#00f2fe" opacity=".8" rx="2"/><circle cx="155" cy="140" r="3" fill="#0b1e38"/><circle cx="170" cy="140" r="3" fill="#0b1e38"/><circle cx="185" cy="140" r="3" fill="#0b1e38"/><line x1="172" x2="172" y1="105" y2="88" stroke="#fff" stroke-width="2"/><line x1="165" x2="179" y1="94" y2="94" stroke="#00f2fe" stroke-width="2"/></g><text x="320" y="130" fill="#fff" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="1">Awesome Ship Management 🚢</text><text x="320" y="175" fill="#00f2fe" class="glow-text" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing=".5">Curated Fleet Technical Management, PMS, Crewing &amp; Maritime ERP Systems</text><text x="320" y="215" fill="#a0aec0" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="15" font-weight="400">⚡ 13 Commercial SaaS Leaders • 🌐 Open-Source Fleet Tools • 📊 Market &amp; Valuation Insights</text></svg>