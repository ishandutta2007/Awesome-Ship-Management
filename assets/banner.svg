<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101e"/>
      <stop offset="50%" stop-color="#0b1e38"/>
      <stop offset="100%" stop-color="#040c17"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes waveMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatShip {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    .wave { animation: waveMove 8s ease-in-out infinite; }
    .radar { transform-origin: 1020px 160px; animation: radarRotate 10s linear infinite; }
    .ship { transform-origin: 180px 160px; animation: floatShip 4s ease-in-out infinite; }
    .glow-text { filter: drop-shadow(0px 0px 8px rgba(0, 242, 254, 0.6)); }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/>

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Animated Radar Sweep -->
  <g opacity="0.6">
    <circle cx="1020" cy="160" r="110" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <circle cx="1020" cy="160" r="75" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3"/>
    <circle cx="1020" cy="160" r="40" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.2"/>
    <circle cx="1020" cy="160" r="110" fill="url(#radar-glow)"/>
    <g class="radar">
      <path d="M 1020 160 L 1130 160 A 110 110 0 0 0 1020 50 Z" fill="url(#accent-grad)" opacity="0.25"/>
      <line x1="1020" y1="160" x2="1130" y2="160" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    </g>
    <!-- Radar blips -->
    <circle cx="1060" cy="120" r="3.5" fill="#00f2fe" class="glow-text"/>
    <circle cx="990" cy="200" r="2.5" fill="#4facfe"/>
    <circle cx="1080" cy="190" r="3" fill="#00f2fe"/>
  </g>

  <!-- Waves -->
  <g class="wave" opacity="0.25">
    <path d="M-100 260 Q 50 240, 200 260 T 500 260 T 800 260 T 1100 260 T 1400 260 L 1400 320 L -100 320 Z" fill="#00f2fe"/>
    <path d="M-100 275 Q 100 260, 300 275 T 700 275 T 1100 275 T 1500 275 L 1500 320 L -100 320 Z" fill="#4facfe"/>
  </g>

  <!-- Ship Vector Illustration -->
  <g class="ship">
    <!-- Vessel Hull -->
    <path d="M 100 175 L 240 175 L 270 145 L 245 190 L 110 190 Z" fill="url(#accent-grad)" filter="url(#glow)"/>
    <!-- Superstructure -->
    <rect x="140" y="125" width="65" height="45" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="155" y="105" width="35" height="20" rx="2" fill="#00f2fe" opacity="0.8"/>
    <!-- Windows -->
    <circle cx="155" cy="140" r="3" fill="#0b1e38"/>
    <circle cx="170" cy="140" r="3" fill="#0b1e38"/>
    <circle cx="185" cy="140" r="3" fill="#0b1e38"/>
    <!-- Mast & Radar -->
    <line x1="172" y1="105" x2="172" y2="88" stroke="#ffffff" stroke-width="2"/>
    <line x1="165" y1="94" x2="179" y2="94" stroke="#00f2fe" stroke-width="2"/>
  </g>

  <!-- Main Title & Subtitle -->
  <text x="320" y="130" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-weight="800" font-size="42" fill="#ffffff" letter-spacing="1">
    Awesome Ship Management 🚢
  </text>
  <text x="320" y="175" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-weight="500" font-size="20" fill="#00f2fe" letter-spacing="0.5" class="glow-text">
    Curated Fleet Technical Management, PMS, Crewing &amp; Maritime ERP Systems
  </text>
  <text x="320" y="215" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-weight="400" font-size="15" fill="#a0aec0">
    ⚡ 13 Commercial SaaS Leaders • 🌐 Open-Source Fleet Tools • 📊 Market &amp; Valuation Insights
  </text>
</svg>
